name: test

on:
  push:
    branches:
      - '*'
    tags-ignore:
      - '*'
  pull_request:

jobs:
  raku:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        raku-version:
          - 'latest'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check out matching Red source
        uses: actions/checkout@v7
        with:
          repository: FCO/Red
          ref: 589fc491a8544b0d9c2f0a086431256a71322689
          path: .red
      - name: Apply Red companion changes
        run: git -C .red apply ../tools/red-companion.patch
      - uses: Raku/setup-raku@v1
        with:
          raku-version: ${{ matrix.raku-version }}
      - name: Work around Alien macOS library detection
        if: runner.os == 'macOS'
        run: raku tools/install-native-deps.raku macos
      - name: Install matching Red
        run: zef install --/test .red
      - name: Work around DB::DuckDB Windows archive extraction
        if: runner.os == 'Windows'
        run: raku tools/install-native-deps.raku windows
      - name: Install and test DuckDB dependencies on Linux
        if: runner.os == 'Linux'
        env:
          TZ: UTC
        run: |
          # DB::DuckDB subprocess tests cannot see zef's staging repository.
          zef install DB Alien::Libduckdb
          zef install 'DB::DuckDB:ver<1.0.1>:auth<zef:skyter10086>'
      - name: Install Dependencies
        run: zef install --/test --test-depends --deps-only .
      - name: Install App::Prove6
        run: zef install --/test App::Prove6
      - name: Test Raku tools
        env:
          RED_CHECKOUT: .red
        run: prove6 -Ilib tools/t
      - name: Run Tests
        run: prove6 -Ilib t
